# @format

services:
  - type: web
    name: trader-street-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir ML_model --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 predict_server:app
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: trader-street-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ML_SERVER_URL
        fromService:
          type: web
          name: trader-street-ml
          property: host
